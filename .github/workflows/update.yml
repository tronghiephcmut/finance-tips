name: Cập nhật bản tin

on:
  schedule:
    - cron: "0 0-15,22-23 * * *"   # Mỗi giờ từ 05:00 đến 22:00 giờ Việt Nam (22:00–15:00 UTC)
  workflow_dispatch:          # cho phép bấm "Run workflow" bằng tay

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # tùy chọn, có thể để trống
      - name: Commit index.html
        run: |
          git config user.name  "bangtin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Cập nhật $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "không có thay đổi"
          git push
